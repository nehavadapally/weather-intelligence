command: ["python", "app.py"]
env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: NWS_API_BASE_URL
    value: "https://api.weather.gov"
  - name: GEOCODER_BASE_URL
    value: "https://nominatim.openstreetmap.org"
  - name: NWS_USER_AGENT
    value: "weather-intelligence-homework/1.0 (https://github.com/nehavadapally/weather-intelligence)"
  - name: WEATHER_DOCUMENTS_TABLE_NAME
    value: "weather_documents"
  - name: WEATHER_EMBEDDINGS_TABLE_NAME
    value: "weather_embeddings"
  - name: WEATHER_EMBEDDING_MODEL
    value: "sentence-transformers/all-MiniLM-L6-v2"
